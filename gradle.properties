# ---- JVM -------------------------------------------------------------------------------------
# 4 GB because KSP runs three annotation processors (Room, Hilt, and Room's schema export) over 66
# Kotlin files, and the Compose compiler plugin holds a lot of IR in memory. The default 1.5 GB
# produces an OutOfMemoryError partway through KSP that reads like a random compilation failure.
# Drop to 3 GB if your machine is tight; below that expect intermittent failures.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ---- Build performance -----------------------------------------------------------------------
# Nine modules with a mostly-flat dependency graph, so parallel execution is a real win.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---- AndroidX --------------------------------------------------------------------------------
# Required. Compose, Room, WorkManager and Hilt are all AndroidX; without this the build fails
# immediately with a support-library conflict.
android.useAndroidX=true

# Each module gets its own R class containing only its own resources, instead of one merged R class
# containing every resource in the build. Faster incremental builds and smaller final classes.
android.nonTransitiveRClass=true

# ---- Kotlin ----------------------------------------------------------------------------------
kotlin.code.style=official

# KSP runs in the Gradle daemon rather than forking a JVM per module. Meaningfully faster across
# nine modules; disable if you see KSP-related daemon instability.
ksp.useKSP2=false

# ---- Deliberately not set --------------------------------------------------------------------
# android.enableR8.fullMode is on by default in AGP 8 and we want it. See app/proguard-rules.pro
#   for the keep rules that make it safe with kotlinx.serialization.
# android.defaults.buildfeatures.* are left alone: buildFeatures are declared per module, which is
#   why :core:model does not pay for Compose.
