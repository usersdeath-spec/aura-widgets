<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="Prism adaptive icon foreground">
  <!--
    Adaptive icon foreground. 108x108 with the mark confined to the inner 66x66 safe zone, so no
    mask on any OEM launcher can clip it — circle, squircle, teardrop, or the square that Samsung
    still ships. The mark is three shapes, which is why it survives at 48px in a notification.
  -->
  <defs>
    <linearGradient id="fgFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="fgEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <g transform="translate(54 54)">
    <rect x="-32" y="-2" width="18" height="4" rx="2" fill="#FFFFFF" opacity="0.92"/>
    <g stroke-linecap="round" stroke-width="3.4" fill="none">
      <path d="M8 0 L31 -11" stroke="#7C5CFF"/>
      <path d="M8 0 L32 0" stroke="#3FD8E0"/>
      <path d="M8 0 L31 11" stroke="#FFB35C"/>
    </g>
    <path d="M-4 -25 L18 17 L-26 17 Z" fill="url(#fgFace)"/>
    <path d="M-4 -25 L18 17 L-26 17 Z" fill="none" stroke="url(#fgEdge)" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
