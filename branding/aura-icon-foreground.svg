<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="Aura adaptive foreground">
  <!--
    Adaptive foreground: the tile only. The corona lives in the background layer, because a circular
    OEM mask would slice a foreground glow and leave a visible hard edge where light should fade.
  -->
  <defs>
    <linearGradient id="fgTile" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2A2F3C"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="fgRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect x="31" y="29" width="46" height="46" rx="13" fill="url(#fgTile)"/>
  <rect x="31" y="29" width="46" height="46" rx="13" fill="none" stroke="url(#fgRim)" stroke-width="1.4"/>
  <rect x="39" y="60" width="30" height="6" rx="3" fill="#8B5CF6"/>
  <rect x="39" y="39" width="17" height="17" rx="5" fill="#FFFFFF" opacity="0.1"/>
</svg>
