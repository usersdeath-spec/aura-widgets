<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="Prism themed icon">
  <!--
    Themed icon (Android 13+). The system recolours this to the user's Material You palette, so it
    must be a silhouette: no gradients, no colour, no thin strokes that vanish under tinting.

    The refracted beams become three solid bars of equal weight — the spectrum idea survives as
    *three of something* even when the system paints them one colour, which is the test a themed
    icon has to pass.
  -->
  <g transform="translate(54 54)" fill="#000000">
    <rect x="-32" y="-2.5" width="18" height="5" rx="2.5"/>
    <rect x="8" y="-13.5" width="24" height="5" rx="2.5" transform="rotate(-19 8 -11)"/>
    <rect x="8" y="-2.5" width="24" height="5" rx="2.5"/>
    <rect x="8" y="8.5" width="24" height="5" rx="2.5" transform="rotate(19 8 11)"/>
    <path d="M-4 -25 L18 17 L-26 17 Z M-4 -14.5 L11 12 L-19 12 Z" fill-rule="evenodd"/>
  </g>
</svg>
