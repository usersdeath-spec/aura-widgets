<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Prism wordmark">
  <!--
    Wordmark. The prism glyph replaces nothing and sits ahead of the word at cap height, so the
    lockup works at 24px in a settings row and at 400px on a store banner without a second file.
    Tracking is tight (-0.03em equivalent) to match the Minimal Mono family's display treatment.
  -->
  <defs>
    <linearGradient id="wmGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <g transform="translate(24 36)">
    <path d="M44 0 L88 84 L0 84 Z" fill="none" stroke="url(#wmGlass)" stroke-width="7" stroke-linejoin="round"/>
    <g stroke-linecap="round" stroke-width="6" fill="none" opacity="0.95">
      <path d="M92 42 L128 22" stroke="#7C5CFF"/>
      <path d="M92 42 L128 42" stroke="#3FD8E0"/>
      <path d="M92 42 L128 62" stroke="#FFB35C"/>
    </g>
  </g>

  <text x="196" y="106"
        font-family="Bricolage Grotesque, Inter Tight, system-ui, sans-serif"
        font-size="88" font-weight="600" letter-spacing="-2.6" fill="#E8E9ED">Prism</text>
</svg>
