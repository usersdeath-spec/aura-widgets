# Gradle 8.11.1 is the version this project is pinned to.
#
# Why this one: AGP 8.7.3 requires Gradle 8.9 or newer, and Kotlin 2.1.0 with the Compose compiler
# plugin is tested against the 8.9-8.11 line. 8.11.1 is the latest patch in that range, so it is the
# newest version that is safe rather than the newest version that exists.
#
# NOTE: there is no gradle-wrapper.jar beside this file. The gradlew scripts in this project are
# self-contained and do the jar's work themselves, so none is needed. After your first successful
# build, run `./gradlew wrapper` to generate the canonical gradlew + jar from the distribution that
# was just installed.
#
# distributionSha256Sum is deliberately absent. I could not download the distribution to compute its
# checksum, and a fabricated hash would fail every build with a confusing integrity error. If you
# want the check, take the published SHA-256 for gradle-8.11.1-bin.zip from
# https://gradle.org/release-checksums/ and add it here as:
#   distributionSha256Sum=<hash>
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
